name: CI

on:
  pull_request:
    branches: [main]
  # PRs can only restore caches saved on their base branch, so main saves them.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint, ESLint, knip)
        run: npm run lint:js

      - name: Format check (Prettier)
        run: npx prettier --check .

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # PRs restore main's cache without saving their own ~500 MB copy, which
      # would push main's out of the repo's 10 GB cache limit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! needs dist/ to exist; the js job builds the real one.
      - run: mkdir dist

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  vitest:
    runs-on: macos-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx vitest run --shard=${{ matrix.shard }}/3
