name: CI

on:
  pull_request:
    branches: [main]
  # PRs can only restore caches saved on their base branch, so main saves them.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # PRs restore main's cache without saving their own ~500 MB copy, which
      # would push main's out of the repo's 10 GB cache limit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # tauri::generate_context! needs dist/ to exist before Rust compiles.
      - run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint + Clippy)
        run: npm run lint

      - name: Format check (Prettier + rustfmt)
        run: npm run format:check

      - name: Tests (Vitest + cargo test)
        run: npm run test
