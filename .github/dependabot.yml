version: 2
updates:
  # New models reach the app only through pi's catalog and the Claude bridge.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@earendil-works/pi-coding-agent"
      - dependency-name: "pi-claude-bridge"
      # The Windows sandbox is alpha; its fixes arrive here.
      - dependency-name: "@anthropic-ai/*"
    groups:
      pi:
        patterns: ["@earendil-works/pi-coding-agent", "pi-claude-bridge"]
      anthropic-ai:
        patterns: ["@anthropic-ai/*"]
    commit-message:
      prefix: build
      include: scope
