# npm's flat node_modules: pi's extensions load packages they don't declare.
nodeLinker: hoisted

# Only node-pty's script is needed (its native module); tree-sitter's would build
# bindings the app doesn't use, as it loads their .wasm.
allowBuilds:
  "@google/genai": false
  node-pty: true
  protobufjs: false
  tree-sitter-bash: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false

# recheck's Java fallback (22 MB): every platform Ignite ships has its native binary.
ignoredOptionalDependencies:
  - recheck-jar

minimumReleaseAgeExclude:
  - "@anthropic-ai/sandbox-runtime@0.0.80"

# pi-mcp-adapter's peer range stops at pi-ai 0.87; it runs on the one pi-coding-agent brings.
peerDependencyRules:
  allowedVersions:
    pi-mcp-adapter>@earendil-works/pi-ai: "*"

# A one-document lockfile: Dependabot reads only pnpm 12's first document (the pnpm version),
# so it would see no dependencies (dependabot-core#15904).
pmOnFail: ignore
