# npm's flat node_modules: pi's extensions load packages they don't declare.
nodeLinker: hoisted

# Only node-pty's script is needed (its native module).
allowBuilds:
  "@google/genai": false
  node-pty: true
  protobufjs: false

# recheck's Java and native backends (~50 MB): it falls back to its JavaScript one,
# fast enough for the short regexes pi-mcp-adapter's tool search checks.
ignoredOptionalDependencies:
  - recheck-jar
  - recheck-linux-arm64
  - recheck-linux-x64
  - recheck-macos-arm64
  - recheck-macos-x64
  - recheck-windows-x64

minimumReleaseAgeExclude:
  - "@anthropic-ai/sandbox-runtime@0.0.80"
  - pi-mcp-adapter@6.0.0

# A one-document lockfile: Dependabot reads only pnpm 12's first document (the pnpm version),
# so it would see no dependencies (dependabot-core#15904).
pmOnFail: ignore
