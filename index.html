<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignite</title>
  </head>

  <body>
    <div id="root"></div>
    <!-- A composer while the app loads, hidden once React draws into #root. -->
    <div id="boot">
      <style>
        #boot {
          --bg: #fff;
          --fg: #57606a;
          --hi: #1f2328;
          --line: #d0d7de;
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 16px;
          background: var(--bg);
          color: var(--fg);
          font:
            14px -apple-system,
            system-ui,
            sans-serif;
        }
        @media (prefers-color-scheme: dark) {
          #boot {
            --bg: #000;
            --fg: #8b949e;
            --hi: #e6edf3;
            --line: #30363d;
          }
        }
        #boot div {
          width: 340px;
          border-top: 1px solid var(--line);
          padding: 14px 2px 0;
        }
        #boot b {
          display: inline-block;
          width: 2px;
          height: 1.15em;
          margin-left: 1px;
          vertical-align: -0.2em;
          background: var(--hi);
          animation: boot-blink 1s steps(1) infinite;
        }
        #boot p {
          display: flex;
          align-items: center;
          gap: 14px;
          margin: 10px 0 0;
          font-size: 12px;
        }
        #boot i {
          width: 44px;
          height: 10px;
          border-radius: 5px;
          background: var(--line);
          animation: boot-pulse 1.4s ease-in-out infinite;
        }
        #boot i + i {
          width: 28px;
        }
        #root:not(:empty) + #boot {
          display: none;
        }
        @keyframes boot-blink {
          50% {
            opacity: 0;
          }
        }
        @keyframes boot-pulse {
          50% {
            opacity: 0.3;
          }
        }
      </style>
      <div>
        Hang tight<b></b>
        <p><span>+</span><i></i><i></i></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
